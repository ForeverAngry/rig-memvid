[package]
name = "rig-memvid"
version = "0.2.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
readme = "README.md"
description = "Memvid-backed persistent memory and lexical store for Rig agents."
repository = "https://github.com/ForeverAngry/rig-memvid"
authors = ["ForeverAngry"]
keywords = ["rig", "memvid", "ai", "agent", "memory"]
categories = ["text-processing", "database"]

# NOTE: we depend on `rig-core` directly (not the `rig` facade introduced
# by PR #1699's workspace reorg) to keep the dep graph minimal — the
# facade pulls optional integration features we do not need. The local
# `package = "rig-core"` rename preserves the historic `use rig::...`
# import path across this crate while siblings (`rig-compose`,
# `rig-resources`, `rig-mcp`) consume `rig-core` under its `rig_core`
# library name. Downstream consumers see no change to the published
# surface.
[dependencies]
rig = { package = "rig-core", version = "0.37.0", default-features = false }
rig-memory = { version = "0.1.1", optional = true, default-features = false }
memvid-core = { version = "2.0.140", default-features = false }
thiserror = "2.0.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tracing = "0.1.41"
futures = "0.3.32"
# Content hashing for the `compaction` feature's dedup manifest. Pulled
# only when `compaction` is enabled.
blake3 = { version = "1", optional = true, default-features = false }
# rig-compose `ContextItem` projection. Pulled only when the
# `context-projection` feature is enabled so the default build stays
# free of the rig-compose dep. No `path = "..."` here on purpose —
# downstream consumers outside the umbrella workspace must be able to
# build `--features context-projection` against the published crate.
rig-compose = { version = "0.4", optional = true, default-features = false }
# Structured observability event emission for the persist hook,
# compactor, and demotion paths. Pulled only when the `observe`
# feature is enabled.
rig-tap = { version = "0.1", optional = true }

[dev-dependencies]
anyhow = "1.0.102"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rig-compose = { version = "0.4" }
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["lex", "simd"]
lex = ["memvid-core/lex"]
# SIMD-accelerated vector distance kernels (memvid-core default we'd
# otherwise be dropping by setting `default-features = false`). Chained
# into `vec` and `api_embed` so any build that retrieves over embeddings
# always gets the SIMD path, regardless of `default-features`.
simd = ["memvid-core/simd"]
vec = ["memvid-core/vec", "simd"]
api_embed = ["memvid-core/api_embed", "simd"]
temporal = ["memvid-core/temporal_track"]
encryption = ["memvid-core/encryption"]
# Compaction integration: enables `MemvidDemotionHook` and
# `MemvidStoringCompactor`, which adapt rig-core's `DemotionHook` /
# `Compactor` traits onto `MemvidStore`. Pulls `rig-memory` so callers can
# build a `CompactingMemory` whose summaries land in `.mv2` durably, and
# `blake3` for the in-process dedup that satisfies the upstream
# idempotency contract on `(conversation_id, messages)`.
compaction = ["dep:rig-memory", "dep:blake3"]
# Project `MemvidStore` / `InMemoryStore` retrieval hits into
# `rig_compose::ContextItem` so hosts can fold memory recall into a
# shared context pack. Pulls `rig-compose` as a runtime dependency.
context-projection = ["dep:rig-compose"]
# Emit structured observability events (`memory.frame_written`,
# `memory.demoted`, `context.compacted`) from the persist hook,
# demotion hook, and storing compactor. Pulls `rig-tap`. Off by
# default so the standard build stays dependency-free.
observe = ["dep:rig-tap"]

[lints.clippy]
dbg_macro = "forbid"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
expect_used = "deny"
expect_fun_call = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "forbid"
unimplemented = "forbid"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
lto = true
opt-level = "s"

# NOTE: any sibling-folder development overrides
# (e.g. `[patch.crates-io]` redirecting `rig-compose` / `rig-tap` to
# `../rig-compose` and `../rig-tap`) belong in a developer-local
# `.cargo/config.toml` or an out-of-tree workspace `Cargo.toml`. They
# must not live in this published crate's manifest — release-plz runs
# `cargo update` on a fresh checkout where the sibling paths do not
# exist, which breaks release PR creation.
