[package]
name = "rig-memvid"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
description = "Memvid-backed persistent memory and lexical store for Rig agents."
repository = "https://github.com/ForeverAngry/rig-memvid"
authors = ["ForeverAngry"]
keywords = ["rig", "memvid", "ai", "agent", "memory"]
categories = ["text-processing", "database"]

[dependencies]
rig-core = { version = "0.36.0", default-features = false }
memvid-core = { version = "2.0.139", default-features = false }
thiserror = "2.0.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tracing = "0.1.41"
futures = "0.3.32"

[dev-dependencies]
anyhow = "1.0.102"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["lex", "simd"]
lex = ["memvid-core/lex"]
# SIMD-accelerated vector distance kernels (memvid-core default we'd
# otherwise be dropping by setting `default-features = false`). Chained
# into `vec` and `api_embed` so any build that retrieves over embeddings
# always gets the SIMD path, regardless of `default-features`.
simd = ["memvid-core/simd"]
vec = ["memvid-core/vec", "simd"]
api_embed = ["memvid-core/api_embed", "simd"]
temporal = ["memvid-core/temporal_track"]
encryption = ["memvid-core/encryption"]

[lints.clippy]
dbg_macro = "forbid"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
expect_used = "deny"
expect_fun_call = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "forbid"
unimplemented = "forbid"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
lto = true
opt-level = "s"
